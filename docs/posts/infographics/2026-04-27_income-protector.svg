<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .title { font-size: 48px; font-weight: bold; fill: #1a365d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { font-size: 28px; fill: #2d3748; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font-size: 20px; fill: #4a5568; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .value { font-size: 32px; font-weight: bold; fill: #2b6cb0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #e6f2ff; stroke: #2b6cb0; stroke-width: 2; }
      .box-title { font-size: 22px; font-weight: bold; fill: #2b6cb0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .highlight { fill: #f6ad55; }
      .check { fill: #48bb78; }
      .arrow { stroke: #4a5568; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .comparison-text { font-size: 18px; fill: #2d3748; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4a5568" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#ffffff"/>


  <!-- Title -->
  <text x="600" y="60" class="title" text-anchor="middle">Income Protection Journey</text>

  <!-- Stage 1: Working -->
  <rect x="100" y="150" width="220" height="200" class="box"/>
  <text x="210" y="190" class="box-title" text-anchor="middle">Stage 1</text>
  <text x="210" y="220" class="subtitle" text-anchor="middle" font-size="20">Working</text>
  <circle cx="210" cy="290" r="30" fill="#4299e1"/>
  <text x="210" y="300" text-anchor="middle" fill="white" font-size="24">💼</text>
  <text x="210" y="340" class="comparison-text" text-anchor="middle">Earning full</text>
  <text x="210" y="365" class="comparison-text" text-anchor="middle">income</text>

  <!-- Arrow -->
  <path d="M 340 250 L 400 250" class="arrow"/>

  <!-- Stage 2: Injured/Ill -->
  <rect x="430" y="150" width="220" height="200" class="box" fill="#fff5e6"/>
  <text x="540" y="190" class="box-title" text-anchor="middle" fill="#f6ad55">Stage 2</text>
  <text x="540" y="220" class="subtitle" text-anchor="middle" font-size="20" fill="#f6ad55">Injury/Illness</text>
  <circle cx="540" cy="290" r="30" fill="#f6ad55"/>
  <text x="540" y="300" text-anchor="middle" fill="white" font-size="24">🏥</text>
  <text x="540" y="340" class="comparison-text" text-anchor="middle">Can't work</text>
  <text x="540" y="365" class="comparison-text" text-anchor="middle">temporarily</text>

  <!-- Arrow -->
  <path d="M 670 250 L 730 250" class="arrow"/>

  <!-- Stage 3: Protected -->
  <rect x="760" y="150" width="220" height="200" class="box" fill="#e6ffe6"/>
  <text x="870" y="190" class="box-title" text-anchor="middle" fill="#48bb78">Stage 3</text>
  <text x="870" y="220" class="subtitle" text-anchor="middle" font-size="20" fill="#48bb78">Protected</text>
  <circle cx="870" cy="290" r="30" fill="#48bb78"/>
  <text x="870" y="300" text-anchor="middle" fill="white" font-size="24">💰</text>
  <text x="870" y="340" class="comparison-text" text-anchor="middle">Income benefit</text>
  <text x="870" y="365" class="comparison-text" text-anchor="middle">paid out</text>

  <!-- Arrow -->
  <path d="M 1000 250 L 1060 250" class="arrow"/>

  <!-- Stage 4: Recovery -->
  <rect x="1090" y="150" width="220" height="200" class="box"/>
  <text x="1200" y="190" class="box-title" text-anchor="middle">Stage 4</text>
  <text x="1200" y="220" class="subtitle" text-anchor="middle" font-size="20">Recovery</text>
  <circle cx="1200" cy="290" r="30" fill="#4299e1"/>
  <text x="1200" y="300" text-anchor="middle" fill="white" font-size="24">✓</text>
  <text x="1200" y="340" class="comparison-text" text-anchor="middle">Back to work</text>
  <text x="1200" y="365" class="comparison-text" text-anchor="middle">protected</text>

  <!-- Key Metric -->
  <rect x="400" y="450" width="400" height="200" fill="#f0f8ff" stroke="#2b6cb0" stroke-width="3" rx="10"/>
  <text x="600" y="510" class="subtitle" text-anchor="middle">Average Claim Duration</text>
  <text x="600" y="580" class="value" text-anchor="middle">45 Days - 3 Years</text>
  <text x="600" y="630" class="comparison-text" text-anchor="middle">Without protection, many families face</text>
  <text x="600" y="655" class="comparison-text" text-anchor="middle">financial hardship within weeks</text>


  <!-- Footer -->
  <text x="50" y="780" class="label" font-size="16">Generated by Financial Advisor Content Hub</text>
</svg>