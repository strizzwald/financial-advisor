<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .title { font-size: 48px; font-weight: bold; fill: #1a365d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { font-size: 28px; fill: #2d3748; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font-size: 20px; fill: #4a5568; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .value { font-size: 32px; font-weight: bold; fill: #2b6cb0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #e6f2ff; stroke: #2b6cb0; stroke-width: 2; }
      .box-title { font-size: 22px; font-weight: bold; fill: #2b6cb0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .highlight { fill: #f6ad55; }
      .check { fill: #48bb78; }
      .arrow { stroke: #4a5568; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .comparison-text { font-size: 18px; fill: #2d3748; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4a5568" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#ffffff"/>


  <!-- Title -->
  <text x="600" y="60" class="title" text-anchor="middle">Protection Gap Analysis</text>

  <!-- Left side: Without Life Cover -->
  <rect x="80" y="120" width="400" height="600" class="box"/>
  <text x="280" y="160" class="box-title" text-anchor="middle">Without Life Cover</text>

  <!-- Icons and text for without -->
  <circle cx="280" cy="240" r="40" fill="#ff6b6b"/>
  <text x="280" y="250" text-anchor="middle" fill="white" font-size="20">✗</text>
  <text x="280" y="330" class="comparison-text" text-anchor="middle">Family loses</text>
  <text x="280" y="360" class="comparison-text" text-anchor="middle">main income</text>

  <circle cx="280" cy="450" r="40" fill="#ff6b6b"/>
  <text x="280" y="460" text-anchor="middle" fill="white" font-size="20">✗</text>
  <text x="280" y="540" class="comparison-text" text-anchor="middle">Debt burden</text>
  <text x="280" y="570" class="comparison-text" text-anchor="middle">remains</text>

  <circle cx="280" cy="660" r="40" fill="#ff6b6b"/>
  <text x="280" y="670" text-anchor="middle" fill="white" font-size="20">✗</text>
  <text x="280" y="730" class="comparison-text" text-anchor="middle">Future plans</text>
  <text x="280" y="760" class="comparison-text" text-anchor="middle">derailed</text>

  <!-- Right side: With Life Cover -->
  <rect x="720" y="120" width="400" height="600" class="box" fill="#e6ffe6" stroke="#48bb78"/>
  <text x="920" y="160" class="box-title" text-anchor="middle" fill="#48bb78">With Life Cover</text>

  <!-- Icons and text for with -->
  <circle cx="920" cy="240" r="40" fill="#48bb78"/>
  <text x="920" y="250" text-anchor="middle" fill="white" font-size="24">✓</text>
  <text x="920" y="330" class="comparison-text" text-anchor="middle">Family protected</text>
  <text x="920" y="360" class="comparison-text" text-anchor="middle">financially</text>

  <circle cx="920" cy="450" r="40" fill="#48bb78"/>
  <text x="920" y="460" text-anchor="middle" fill="white" font-size="24">✓</text>
  <text x="920" y="540" class="comparison-text" text-anchor="middle">Debts covered</text>
  <text x="920" y="570" class="comparison-text" text-anchor="middle">paid off</text>

  <circle cx="920" cy="660" r="40" fill="#48bb78"/>
  <text x="920" y="670" text-anchor="middle" fill="white" font-size="24">✓</text>
  <text x="920" y="730" class="comparison-text" text-anchor="middle">Dreams stay</text>
  <text x="920" y="760" class="comparison-text" text-anchor="middle">on track</text>

  <!-- Arrow between -->
  <path d="M 520 420 L 680 420" class="arrow"/>


  <!-- Footer -->
  <text x="50" y="780" class="label" font-size="16">Generated by Financial Advisor Content Hub</text>
</svg>