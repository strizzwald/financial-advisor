<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .title { font-size: 48px; font-weight: bold; fill: #1a365d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { font-size: 28px; fill: #2d3748; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font-size: 20px; fill: #4a5568; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .value { font-size: 32px; font-weight: bold; fill: #2b6cb0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #e6f2ff; stroke: #2b6cb0; stroke-width: 2; }
      .box-title { font-size: 22px; font-weight: bold; fill: #2b6cb0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .highlight { fill: #f6ad55; }
      .check { fill: #48bb78; }
      .arrow { stroke: #4a5568; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .comparison-text { font-size: 18px; fill: #2d3748; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4a5568" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#ffffff"/>


  <!-- Title -->
  <text x="600" y="60" class="title" text-anchor="middle">Life Events & Protection Timeline</text>

  <!-- Timeline line -->
  <line x1="150" y1="250" x2="1150" y2="250" stroke="#4a5568" stroke-width="3"/>

  <!-- Age 25 -->
  <circle cx="200" cy="250" r="15" fill="#4299e1"/>
  <text x="200" y="330" class="comparison-text" text-anchor="middle" font-weight="bold">Age 25</text>
  <text x="200" y="360" class="comparison-text" text-anchor="middle">First job</text>
  <text x="200" y="385" class="comparison-text" text-anchor="middle">Start protecting</text>

  <!-- Age 30 -->
  <circle cx="450" cy="250" r="15" fill="#4299e1"/>
  <text x="450" y="330" class="comparison-text" text-anchor="middle" font-weight="bold">Age 30</text>
  <text x="450" y="360" class="comparison-text" text-anchor="middle">Marriage/</text>
  <text x="450" y="385" class="comparison-text" text-anchor="middle">Partnership</text>

  <!-- Age 35 -->
  <circle cx="700" cy="250" r="15" fill="#f6ad55"/>
  <text x="700" y="330" class="comparison-text" text-anchor="middle" font-weight="bold">Age 35</text>
  <text x="700" y="360" class="comparison-text" text-anchor="middle">Children</text>
  <text x="700" y="385" class="comparison-text" text-anchor="middle">Increase coverage</text>

  <!-- Age 45 -->
  <circle cx="950" cy="250" r="15" fill="#f6ad55"/>
  <text x="950" y="330" class="comparison-text" text-anchor="middle" font-weight="bold">Age 45</text>
  <text x="950" y="360" class="comparison-text" text-anchor="middle">Peak earning</text>
  <text x="950" y="385" class="comparison-text" text-anchor="middle">Peak risk years</text>

  <!-- Age 55 -->
  <circle cx="1100" cy="250" r="15" fill="#48bb78"/>
  <text x="1100" y="330" class="comparison-text" text-anchor="middle" font-weight="bold">Age 55</text>
  <text x="1100" y="360" class="comparison-text" text-anchor="middle">Retirement</text>
  <text x="1100" y="385" class="comparison-text" text-anchor="middle">planning</text>

  <!-- Key message -->
  <rect x="300" y="500" width="600" height="150" fill="#e6f2ff" stroke="#2b6cb0" stroke-width="2" rx="10"/>
  <text x="600" y="550" class="subtitle" text-anchor="middle">💡 Key Insight</text>
  <text x="600" y="605" class="comparison-text" text-anchor="middle">Protection needs change throughout life.</text>
  <text x="600" y="635" class="comparison-text" text-anchor="middle">Review your coverage every 3-5 years or after major life events.</text>


  <!-- Footer -->
  <text x="50" y="780" class="label" font-size="16">Generated by Financial Advisor Content Hub</text>
</svg>