<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .title { font-size: 48px; font-weight: bold; fill: #1a365d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { font-size: 28px; fill: #2d3748; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font-size: 20px; fill: #4a5568; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .value { font-size: 32px; font-weight: bold; fill: #2b6cb0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #e6f2ff; stroke: #2b6cb0; stroke-width: 2; }
      .box-title { font-size: 22px; font-weight: bold; fill: #2b6cb0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .highlight { fill: #f6ad55; }
      .check { fill: #48bb78; }
      .arrow { stroke: #4a5568; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .comparison-text { font-size: 18px; fill: #2d3748; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4a5568" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#ffffff"/>


  <!-- Title -->
  <text x="600" y="60" class="title" text-anchor="middle">Funeral Benefit: What It Covers</text>

  <!-- Funeral costs breakdown -->
  <text x="100" y="150" class="subtitle">Typical Funeral Expenses</text>

  <!-- Coffin -->
  <rect x="100" y="180" width="300" height="50" fill="#4299e1"/>
  <text x="110" y="212" class="comparison-text" fill="white">Coffin & Burial</text>
  <text x="410" y="212" class="value">£2,000</text>

  <!-- Service -->
  <rect x="100" y="240" width="350" height="50" fill="#4299e1"/>
  <text x="110" y="272" class="comparison-text" fill="white">Service & Flowers</text>
  <text x="460" y="272" class="value">£2,500</text>

  <!-- Transport -->
  <rect x="100" y="300" width="250" height="50" fill="#4299e1"/>
  <text x="110" y="332" class="comparison-text" fill="white">Transport</text>
  <text x="360" y="332" class="value">£1,500</text>

  <!-- Catering -->
  <rect x="100" y="360" width="300" height="50" fill="#4299e1"/>
  <text x="110" y="392" class="comparison-text" fill="white">Reception/Catering</text>
  <text x="410" y="392" class="value">£2,000</text>

  <!-- Total -->
  <rect x="100" y="420" width="600" height="80" fill="#1a365d"/>
  <text x="120" y="465" class="value" fill="white" font-size="32">Average Total Cost</text>
  <text x="120" y="495" class="subtitle" fill="#f6ad55" font-size="40">£8,000 - £10,000</text>

  <!-- Key message -->
  <rect x="800" y="180" width="350" height="400" fill="#e6ffe6" stroke="#48bb78" stroke-width="3" rx="10"/>
  <text x="975" y="230" class="box-title" text-anchor="middle" fill="#48bb78">Funeral Benefit</text>
  <text x="975" y="280" class="value" text-anchor="middle" fill="#48bb78">£3,000-£10,000</text>

  <text x="975" y="330" class="comparison-text" text-anchor="middle" font-weight="bold">Covers:</text>

  <circle cx="830" cy="370" r="6" fill="#48bb78"/>
  <text x="850" y="375" class="comparison-text">Funeral costs</text>

  <circle cx="830" cy="410" r="6" fill="#48bb78"/>
  <text x="850" y="415" class="comparison-text">Final expenses</text>

  <circle cx="830" cy="450" r="6" fill="#48bb78"/>
  <text x="850" y="455" class="comparison-text">Estate duties</text>

  <circle cx="830" cy="490" r="6" fill="#48bb78"/>
  <text x="850" y="495" class="comparison-text">Peace of mind</text>

  <circle cx="830" cy="530" r="6" fill="#48bb78"/>
  <text x="850" y="535" class="comparison-text">No burden on family</text>


  <!-- Footer -->
  <text x="50" y="780" class="label" font-size="16">Generated by Financial Advisor Content Hub</text>
</svg>